# Add inside BOTH <VirtualHost *:80> and <VirtualHost *:443> of analysis.publicvm.com
# (Virtualmin: Web Configuration -> Edit Directives, or Configure Website -> Edit Directives).
# Needs: a2enmod proxy proxy_http headers
# Port = WEB_PORT (3000 by default; 3310 on analysis.publicvm.com where 3000 is taken)
ProxyPreserveHost On
ProxyRequests Off
ProxyTimeout 180
# keep Let's Encrypt renewals served by Apache itself
ProxyPass /.well-known !
ProxyPass / http://127.0.0.1:3000/ connectiontimeout=10 timeout=180
ProxyPassReverse / http://127.0.0.1:3000/
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
# Inside the :443 vhost only (optional, after HTTPS works):
# Header always set Strict-Transport-Security "max-age=31536000"
